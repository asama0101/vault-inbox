<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" font-family="'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif">
  <title>安全のための作り</title>
  <desc>資料の中の指示には従わない。資料由来の値は、Vault の外の args.txt 経由で渡す。ロックで organize・watch・ask の二重実行を防ぐ。新しい分類先・組み直し・関係の記録は、承認されるまで実行しない。</desc>
  <rect width="800" height="250" fill="#ffffff"/>
  <text x="12" y="24" font-size="15" font-weight="bold" fill="#111">安全のための作り</text>

  <rect x="12" y="44" width="182" height="190" rx="6" fill="#eaf2fb" stroke="#1f5fa8" stroke-width="2"/>
  <text x="103" y="70" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">指示に従わない</text>
  <rect x="32" y="88" width="142" height="40" rx="4" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="103" y="113" font-size="12" text-anchor="middle" fill="#111">「〜へ移せ」の指示</text>
  <text x="103" y="150" font-size="18" font-weight="bold" text-anchor="middle" fill="#a8261f">✕ 実行</text>
  <text x="103" y="178" font-size="12" text-anchor="middle" fill="#111">本文・ファイル名は</text>
  <text x="103" y="196" font-size="12" text-anchor="middle" fill="#111">データとして扱う</text>

  <rect x="210" y="44" width="182" height="190" rx="6" fill="#eaf2fb" stroke="#1f5fa8" stroke-width="2"/>
  <text x="301" y="70" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">値は引数ファイルで</text>
  <rect x="230" y="88" width="142" height="40" rx="4" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="301" y="113" font-size="12" text-anchor="middle" fill="#111">要約・パス・分類先</text>
  <text x="301" y="150" font-size="18" font-weight="bold" text-anchor="middle" fill="#a8261f">✕ 埋め込む</text>
  <text x="301" y="178" font-size="12" text-anchor="middle" fill="#111">Vault の外の</text>
  <text x="301" y="196" font-size="12" text-anchor="middle" fill="#111">args.txt 経由で渡す</text>

  <rect x="408" y="44" width="182" height="190" rx="6" fill="#eaf2fb" stroke="#1f5fa8" stroke-width="2"/>
  <text x="499" y="70" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">ロックで二重実行を防ぐ</text>
  <rect x="428" y="88" width="142" height="40" rx="4" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="499" y="113" font-size="12" text-anchor="middle" fill="#111">organize・watch・ask*</text>
  <text x="499" y="150" font-size="18" font-weight="bold" text-anchor="middle" fill="#a8261f">✕ 同時に書く</text>
  <text x="499" y="178" font-size="12" text-anchor="middle" fill="#111">記録が衝突しない</text>
  <text x="499" y="196" font-size="12" text-anchor="middle" fill="#111">ように 1 つずつ動く</text>
  <text x="499" y="224" font-size="12" text-anchor="middle" fill="#333">* ask は関係の記録時だけ</text>

  <rect x="606" y="44" width="182" height="190" rx="6" fill="#fdf3e3" stroke="#a8641f" stroke-width="2"/>
  <text x="697" y="70" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">承認してから実行</text>
  <rect x="626" y="88" width="142" height="40" rx="4" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="697" y="113" font-size="12" text-anchor="middle" fill="#111">新しい分類先など</text>
  <text x="697" y="150" font-size="18" font-weight="bold" text-anchor="middle" fill="#a8261f">✕ 無断で実行</text>
  <text x="697" y="178" font-size="12" text-anchor="middle" fill="#111">選択肢で承認を得る。</text>
  <text x="697" y="196" font-size="12" text-anchor="middle" fill="#111">既存の分類先は確認なし</text>
</svg>
