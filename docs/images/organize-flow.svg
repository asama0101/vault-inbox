<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif">
  <title>organize の 1 回の流れ</title>
  <desc>準備（初期化の確認・ロック）、rebuild（索引の作り直し）、resume（途中で止まった配置の完了）、scan（手作業への追従）、intake（全文の取り出し）、place（分類して移す）、indexmd（プロパティと要約ノートの更新）、最終報告の順。合う分類先がなければ、新しい分類先を提案して承認を求める。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="12" y="24" font-size="15" font-weight="bold" fill="#111">organize の 1 回の流れ</text>

  <!-- row 1 -->
  <rect x="12" y="44" width="170" height="84" rx="6" fill="#eaf2fb" stroke="#1f5fa8" stroke-width="2"/>
  <text x="97" y="68" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">0 準備</text>
  <text x="97" y="92" font-size="12" text-anchor="middle" fill="#111">初期化の確認</text>
  <text x="97" y="110" font-size="12" text-anchor="middle" fill="#111">ロックを取る</text>

  <rect x="214" y="44" width="170" height="84" rx="6" fill="#eaf2fb" stroke="#1f5fa8" stroke-width="2"/>
  <text x="299" y="68" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">1 rebuild</text>
  <text x="299" y="92" font-size="12" text-anchor="middle" fill="#111">欠けた索引・全文を</text>
  <text x="299" y="110" font-size="12" text-anchor="middle" fill="#111">作り直す</text>

  <rect x="416" y="44" width="170" height="84" rx="6" fill="#eaf2fb" stroke="#1f5fa8" stroke-width="2"/>
  <text x="501" y="68" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">2 resume</text>
  <text x="501" y="92" font-size="12" text-anchor="middle" fill="#111">途中で止まった</text>
  <text x="501" y="110" font-size="12" text-anchor="middle" fill="#111">配置を完了させる</text>

  <rect x="618" y="44" width="170" height="84" rx="6" fill="#eaf2fb" stroke="#1f5fa8" stroke-width="2"/>
  <text x="703" y="68" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">3 scan</text>
  <text x="703" y="92" font-size="12" text-anchor="middle" fill="#111">手作業の移動・改名に</text>
  <text x="703" y="110" font-size="12" text-anchor="middle" fill="#111">追従する</text>

  <line x1="182" y1="86" x2="212" y2="86" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="384" y1="86" x2="414" y2="86" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="586" y1="86" x2="616" y2="86" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- scan の確認 -->
  <rect x="560" y="150" width="228" height="40" rx="5" fill="#f4f4f4" stroke="#555" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="674" y="168" font-size="12" text-anchor="middle" fill="#111">消えた資料と新しい資料の組は、</text>
  <text x="674" y="184" font-size="12" text-anchor="middle" fill="#111">組み直すか選択肢で聞く</text>
  <line x1="703" y1="128" x2="703" y2="148" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>

  <!-- turn -->
  <path d="M 703 190 L 703 214 L 97 214 L 97 236" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- row 2 -->
  <rect x="12" y="238" width="170" height="84" rx="6" fill="#eaf2fb" stroke="#1f5fa8" stroke-width="2"/>
  <text x="97" y="262" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">4 intake</text>
  <text x="97" y="286" font-size="12" text-anchor="middle" fill="#111">inbox/ の全文を</text>
  <text x="97" y="304" font-size="12" text-anchor="middle" fill="#111">取り出す</text>

  <rect x="214" y="238" width="170" height="84" rx="6" fill="#eaf2fb" stroke="#1f5fa8" stroke-width="2"/>
  <text x="299" y="262" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">5 place</text>
  <text x="299" y="286" font-size="12" text-anchor="middle" fill="#111">要約・日付を付け、</text>
  <text x="299" y="304" font-size="12" text-anchor="middle" fill="#111">分類先へ移す</text>

  <rect x="416" y="238" width="170" height="84" rx="6" fill="#eaf2fb" stroke="#1f5fa8" stroke-width="2"/>
  <text x="501" y="262" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">6 indexmd</text>
  <text x="501" y="286" font-size="12" text-anchor="middle" fill="#111">プロパティと</text>
  <text x="501" y="304" font-size="12" text-anchor="middle" fill="#111">要約ノートを更新</text>

  <rect x="618" y="238" width="170" height="84" rx="6" fill="#eaf2fb" stroke="#1f5fa8" stroke-width="2"/>
  <text x="703" y="262" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">7 最終報告</text>
  <text x="703" y="286" font-size="12" text-anchor="middle" fill="#111">inbox/ に残った資料を</text>
  <text x="703" y="304" font-size="12" text-anchor="middle" fill="#111">理由つきで一覧にする</text>

  <line x1="182" y1="280" x2="212" y2="280" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="384" y1="280" x2="414" y2="280" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="586" y1="280" x2="616" y2="280" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 分類先の分岐 -->
  <rect x="150" y="352" width="300" height="56" rx="5" fill="#fdf3e3" stroke="#a8641f" stroke-width="2"/>
  <text x="300" y="376" font-size="12" text-anchor="middle" fill="#111">合う分類先がない → 新しい分類先を提案</text>
  <text x="300" y="394" font-size="12" text-anchor="middle" fill="#111">承認で作る。未承認なら inbox/ に残す</text>
  <line x1="299" y1="322" x2="299" y2="350" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>

  <!-- 凡例 -->
  <rect x="520" y="352" width="28" height="16" rx="3" fill="#eaf2fb" stroke="#1f5fa8" stroke-width="2"/>
  <text x="556" y="365" font-size="12" fill="#111">自動で行う手順</text>
  <rect x="520" y="378" width="28" height="16" rx="3" fill="#fdf3e3" stroke="#a8641f" stroke-width="2"/>
  <text x="556" y="391" font-size="12" fill="#111">承認を求める（選択肢）</text>
  <line x1="520" y1="418" x2="548" y2="418" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="556" y="422" font-size="12" fill="#111">条件つきの分岐</text>
</svg>
